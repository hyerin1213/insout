<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 관리자 데스크 - IN'S OUT CASINO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK 호환 버전 로드 -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0b0d13;
      --card-bg: rgba(23, 27, 38, 0.95);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-primary: #f5c842;
      --neon-cyan: #00e5ff;
      --neon-green: #00ffaa;
      --accent-red: #ff5252;
      --text-main: #f0f2f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 0 12px calc(50px + env(safe-area-inset-bottom));
      line-height: 1.4;
    }

    /* 잠금 화면 */
    .lock-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #0b0d13;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lock-box {
      width: 100%;
      max-width: 320px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .lock-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--gold-primary);
      margin-bottom: 6px;
    }

    .lock-sub {
      font-size: 12px;
      color: #8c93a3;
      margin-bottom: 18px;
    }

    .lock-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-size: 15px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
    }

    .lock-input:focus { border-color: var(--gold-primary); }

    .lock-btn {
      width: 100%;
      background: var(--gold-primary);
      color: #0b0d13;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .error-msg {
      color: var(--accent-red);
      font-size: 12px;
      margin-top: 8px;
      display: none;
      font-weight: 700;
    }

    /* 상단 네비 */
    .top-nav {
      position: sticky;
      top: 0;
      background: rgba(11, 13, 19, 0.95);
      backdrop-filter: blur(10px);
      padding: calc(12px + env(safe-area-inset-top)) 4px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      margin-bottom: 14px;
      z-index: 10;
    }

    .back-btn {
      color: var(--gold-primary);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
    }

    .sync-status {
      font-size: 11px;
      color: #00ffaa;
      font-weight: 700;
    }

    .reset-btn {
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid rgba(255, 82, 82, 0.3);
      color: #ff8a80;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .main-wrap {
      max-width: 500px;
      margin: 0 auto;
    }

    .page-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .page-sub {
      font-size: 11.5px;
      color: #8c93a3;
      margin-bottom: 14px;
    }

    /* 상단 메인 모드 탭 */
    .main-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .mode-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #8c93a3;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .mode-btn.active {
      background: rgba(245, 200, 66, 0.15);
      border-color: var(--gold-primary);
      color: var(--gold-primary);
    }

    /* 1. 참가자 관리 스타일 */
    .list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 8px;
    }

    .user-name-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-idx {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold-primary);
      width: 20px;
    }

    .name-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      width: 100px;
      padding: 2px 0;
      outline: none;
    }

    .name-input:focus { border-bottom-color: var(--gold-primary); }

    .rebuy-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .count-label { font-size: 11px; color: #8c93a3; }
    .count-val {
      font-size: 14px;
      font-weight: 800;
      color: var(--gold-primary);
      min-width: 16px;
      text-align: center;
    }

    .btn-step {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #171b26;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .card-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .toggle-btn {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 7px 6px;
      font-size: 11px;
      font-weight: 700;
      color: #8c93a3;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }

    .toggle-btn.active-overcooked {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .toggle-btn.active-nintendo {
      background: rgba(255, 82, 82, 0.15);
      border-color: var(--accent-red);
      color: #ff8a80;
    }

    /* 2. 예약 관리 스타일 */
    .game-tab-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }

    .game-tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #8c93a3;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .game-tab-btn.active {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }

    .reg-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      position: relative;
    }

    .reg-input-group {
      display: flex;
      gap: 8px;
      position: relative;
    }

    .reg-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 9px 12px;
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }

    .reg-input:focus { border-color: var(--gold-primary); }

    .reg-btn {
      background: var(--gold-primary);
      border: none;
      color: #0b0d13;
      font-weight: 800;
      font-size: 12.5px;
      padding: 0 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .autocomplete-box {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #151923;
      border: 1px solid var(--gold-primary);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      max-height: 180px;
      overflow-y: auto;
      z-index: 50;
      display: none;
    }

    .autocomplete-item {
      padding: 10px 14px;
      font-size: 13.5px;
      color: #cfd4dc;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover, .autocomplete-item:active {
      background: rgba(245, 200, 66, 0.15);
      color: #fff;
    }

    .autocomplete-item .match-badge {
      font-size: 11px;
      color: var(--gold-primary);
      font-weight: 700;
    }

    .queue-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8c93a3;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    /* 실행 취소(복구) 버튼 스타일 */
    .undo-btn {
      background: rgba(245, 200, 66, 0.12);
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 4px;
    }

    .queue-item {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .queue-num {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--gold-primary);
      margin-right: 8px;
    }

    .queue-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .queue-time {
      font-size: 11px;
      color: #717888;
    }

    .q-btn-done { 
      background: rgba(0, 229, 255, 0.15); 
      border: 1px solid var(--neon-cyan); 
      color: var(--neon-cyan);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .q-btn-done:active {
      background: var(--neon-cyan);
      color: #0b0d13;
    }

    .empty-state {
      text-align: center;
      padding: 26px 0;
      color: #61677a;
      font-size: 12.5px;
    }

    /* 어디든 클릭하면 닫히는 경고 모달 */
    .warn-modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s ease-out;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .warn-modal-box {
      width: 100%;
      max-width: 320px;
      background: #141722;
      border: 1px solid rgba(255, 82, 82, 0.5);
      border-radius: 14px;
      padding: 22px 18px 18px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 82, 82, 0.2);
      pointer-events: auto;
    }

    .warn-modal-icon {
      font-size: 32px;
      line-height: 1;
      margin-bottom: 10px;
    }

    .warn-modal-title {
      font-size: 16px;
      font-weight: 800;
      color: #ff5252;
      margin-bottom: 8px;
    }

    .warn-modal-desc {
      font-size: 13px;
      color: #cfd4dc;
      line-height: 1.5;
      margin-bottom: 14px;
      word-break: keep-all;
    }

    .warn-modal-desc strong {
      color: #fff;
    }

    .warn-modal-hint {
      font-size: 11px;
      color: #717888;
      letter-spacing: -0.2px;
    }
  </style>
</head>
<body>

  <!-- 어디든 클릭 시 닫히는 경고 모달 -->
  <div id="warnModalOverlay" class="warn-modal-overlay" onclick="closeWarnModal()">
    <div class="warn-modal-box">
      <div class="warn-modal-icon">⚠️</div>
      <div class="warn-modal-title">등록 불가 안내</div>
      <div class="warn-modal-desc" id="warnModalMessage"></div>
      <div class="warn-modal-hint">화면 아무 곳이나 누르면 닫힙니다.</div>
    </div>
  </div>

  <!-- 비밀번호 인증 잠금 화면 -->
  <div id="lockOverlay" class="lock-overlay">
    <div class="lock-box">
      <div class="lock-title">🔒 ADMIN VERIFICATION</div>
      <div class="lock-sub">관리자 전용 접근 화면입니다.</div>
      <input type="password" id="pwInput" class="lock-input" placeholder="비밀번호 입력">
      <button class="lock-btn" onclick="checkPW()">접속하기</button>
      <div id="errorMsg" class="error-msg">비밀번호가 올바르지 않습니다.</div>
    </div>
  </div>

  <!-- 상단 네비 -->
  <div class="top-nav">
    <a href="index.html" class="back-btn">‹ 메인으로</a>
    <span class="sync-status">● 실시간 동기화 켜짐</span>
    <button class="reset-btn" id="headerActionBtn" onclick="handleReset()">기록 초기화</button>
  </div>

  <div class="main-wrap">
    <div class="page-title">⚙️ 카지노 운영 관리 데스크</div>
    <div class="page-sub">모든 관리자 화면에 1초 이내로 실시간 자동 동기화됩니다.</div>

    <!-- 모드 선택 탭 -->
    <div class="main-tabs">
      <button class="mode-btn active" id="tabUsersBtn" onclick="switchView('users')">👥 참가자 리바인/제한</button>
      <button class="mode-btn" id="tabQueueBtn" onclick="switchView('queue')">📋 테이블 예약 순번</button>
    </div>

    <!-- VIEW 1: 참가자 관리 섹션 -->
    <div id="viewUsers">
      <div id="userList" class="list-container"></div>
    </div>

    <!-- VIEW 2: 테이블 게임 예약 관리 섹션 -->
    <div id="viewQueue" style="display: none;">
      <div class="game-tab-bar">
        <button class="game-tab-btn active" onclick="switchQueueGame('holdem')">♠️ 홀덤</button>
        <button class="game-tab-btn" onclick="switchQueueGame('blackjack')">🃏 블랙잭</button>
        <button class="game-tab-btn" onclick="switchQueueGame('roulette')">🎯 룰렛</button>
      </div>

      <!-- 대기자 등록 폼 & 초성 검색 입력창 -->
      <div class="reg-card">
        <div class="reg-input-group">
          <input type="text" id="queuePlayerInput" class="reg-input" 
                 placeholder="이름 또는 초성 검색 (예: ㄹㅈㅇ, 김민기)" 
                 autocomplete="off"
                 oninput="handleNameSearch(this.value)" 
                 onkeypress="if(event.keyCode==13) addQueuePlayer()">
          <button class="reg-btn" onclick="addQueuePlayer()">등록</button>

          <!-- 초성/이름 검색 드롭다운 -->
          <div id="autocompleteBox" class="autocomplete-box"></div>
        </div>
      </div>

      <div class="queue-info-bar">
        <div>
          <span id="queueGameTitle" style="font-weight: 700; color: #fff;">♠️ 홀덤 대기 명단</span>
          <span style="margin-left: 6px;">대기 중: <strong id="queueTotalCount" style="color: var(--gold-primary);">0</strong>명</span>
        </div>
        <!-- 최대 3회 착석 취소(복구) 버튼 -->
        <button id="undoQueueBtn" class="undo-btn" onclick="undoLastFinish()"></button>
      </div>

      <div id="queueListContainer"></div>
    </div>
  </div>

  <script>
    // 1. Firebase 초기화
    const firebaseConfig = {
      apiKey: "AIzaSyD2iFUXGnZzag8M51sQSTo27tPMsvAS5_Y",
      authDomain: "insout-898fa.firebaseapp.com",
      databaseURL: "https://insout-898fa-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "insout-898fa",
      storageBucket: "insout-898fa.firebasestorage.app",
      messagingSenderId: "116213907100",
      appId: "1:116213907100:web:f4d3bb35c4b6a758c97759"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const adminRef = db.ref('casino_users');
    const queueRootRef = db.ref('casino_table_queues');

    const defaultNames = [
      "김민기", "이용규", "김성기", "이주명", "이나예", 
      "정홍주", "허채윤", "이경준", "김나희", "김보경", 
      "이재준", "오준성", "문기원", "김수린", "박지윤", 
      "김주한", "최성규", "조보현", "노윤탁", "신다슬",
      "", "", "", ""
    ];

    let currentUsers = [];
    let currentView = 'users';
    let currentQueueGame = 'holdem';
    let currentQueueData = {}; 
    
    // 최대 3개까지 저장하는 복구 스택 (배열)
    let undoStack = []; 

    const queueGameTitles = {
      holdem: '♠️ 홀덤 대기 명단',
      blackjack: '🃏 블랙잭 대기 명단',
      roulette: '🎯 룰렛 대기 명단'
    };

    // 모달 제어 함수
    function showWarnModal(name) {
      const modal = document.getElementById('warnModalOverlay');
      const msg = document.getElementById('warnModalMessage');
      msg.innerHTML = `<strong>'${name}'</strong>(은)는 참가자 명단에 등록되지 않은 이름입니다.<br><br>명단을 확인하거나 자동완성 추천 이름을 선택해 주세요.`;
      modal.style.display = 'flex';
    }

    function closeWarnModal() {
      const modal = document.getElementById('warnModalOverlay');
      modal.style.display = 'none';
      const input = document.getElementById('queuePlayerInput');
      if (input) input.focus();
    }

    // 2. 한글 초성 검색 알고리즘
    const CHO_HANGUL = [
      'ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 
      'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'
    ];

    function getChosung(str) {
      let result = '';
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 44032;
        if (code > -1 && code < 11172) {
          result += CHO_HANGUL[Math.floor(code / 588)];
        } else {
          result += str.charAt(i);
        }
      }
      return result;
    }

    function matchKorean(target, keyword) {
      if (!keyword) return false;
      const cleanTarget = target.trim();
      const cleanKey = keyword.trim();
      if (!cleanTarget) return false;

      if (cleanTarget.includes(cleanKey)) return true;

      const targetChosung = getChosung(cleanTarget);
      if (targetChosung.includes(cleanKey)) return true;

      return false;
    }

    function handleNameSearch(val) {
      const box = document.getElementById('autocompleteBox');
      const query = val.trim();
      if (!query) {
        box.style.display = 'none';
        return;
      }

      const namePool = currentUsers
        .map(u => u.name ? u.name.trim() : '')
        .filter(n => n.length > 0);

      const matches = namePool.filter(name => matchKorean(name, query));

      if (matches.length === 0) {
        box.style.display = 'none';
        return;
      }

      box.innerHTML = matches.map(name => `
        <div class="autocomplete-item" onclick="selectName('${name}')">
          <span style="font-weight:700; color:#fff;">${name}</span>
          <span class="match-badge">${getChosung(name)}</span>
        </div>
      `).join('');
      box.style.display = 'block';
    }

    function selectName(name) {
      const input = document.getElementById('queuePlayerInput');
      input.value = name;
      document.getElementById('autocompleteBox').style.display = 'none';
      input.focus();
    }

    document.addEventListener('click', (e) => {
      const box = document.getElementById('autocompleteBox');
      const input = document.getElementById('queuePlayerInput');
      if (box && !box.contains(e.target) && e.target !== input) {
        box.style.display = 'none';
      }
    });

    // 3. 비밀번호 검증 (escape)
    function checkPW() {
      const input = document.getElementById('pwInput').value;
      if (input === "escape") {
        document.getElementById('lockOverlay').style.display = 'none';
        sessionStorage.setItem('ins_out_auth', 'ok');
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    }

    if (sessionStorage.getItem('ins_out_auth') === 'ok') {
      document.getElementById('lockOverlay').style.display = 'none';
    }

    document.getElementById('pwInput').addEventListener("keyup", function(e) {
      if (e.key === "Enter") checkPW();
    });

    // 4. 모드 탭 전환
    function switchView(view) {
      currentView = view;
      document.getElementById('tabUsersBtn').classList.toggle('active', view === 'users');
      document.getElementById('tabQueueBtn').classList.toggle('active', view === 'queue');
      document.getElementById('viewUsers').style.display = (view === 'users') ? 'block' : 'none';
      document.getElementById('viewQueue').style.display = (view === 'queue') ? 'block' : 'none';

      const actionBtn = document.getElementById('headerActionBtn');
      if (view === 'users') {
        actionBtn.textContent = '기록 초기화';
      } else {
        actionBtn.textContent = '대기열 비우기';
      }
    }

    function handleReset() {
      if (currentView === 'users') {
        resetAll();
      } else {
        resetCurrentQueue();
      }
    }

    // 5. 참가자 관리 파트
    adminRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        const initData = defaultNames.map((name, i) => ({
          id: i + 1,
          name: name,
          overcooked: false,
          nintendoLimit: false,
          rebuyinCount: 0
        }));
        adminRef.set(initData);
      } else {
        currentUsers = data;
        renderList(currentUsers);
      }
    });

    function renderList(users) {
      const container = document.getElementById('userList');
      container.innerHTML = '';

      users.forEach((user, index) => {
        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `
          <div class="card-top">
            <div class="user-name-box">
              <span class="user-idx">${String(index + 1).padStart(2, '0')}</span>
              <input type="text" class="name-input" value="${user.name || ''}" placeholder="이름 입력" onchange="updateName(${index}, this.value)">
            </div>
            <div class="rebuy-counter">
              <span class="count-label">리바인</span>
              <button class="btn-step" onclick="changeRebuy(${index}, -1)">-</button>
              <span class="count-val">${user.rebuyinCount || 0}</span>
              <button class="btn-step" onclick="changeRebuy(${index}, 1)">+</button>
            </div>
          </div>
          <div class="card-bottom">
            <div class="toggle-btn ${user.overcooked ? 'active-overcooked' : ''}" onclick="toggleOvercooked(${index})">
              🍳 오버쿡 무료: <strong>${user.overcooked ? '완료' : '미달성'}</strong>
            </div>
            <div class="toggle-btn ${user.nintendoLimit ? 'active-nintendo' : ''}" onclick="toggleNintendo(${index})">
              🎮 5연승 제한: <strong>${user.nintendoLimit ? '해당' : '정상'}</strong>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateName(idx, val) {
      adminRef.child(idx).child('name').set(val.trim());
    }

    function changeRebuy(idx, delta) {
      const current = currentUsers[idx].rebuyinCount || 0;
      const next = Math.max(0, current + delta);
      adminRef.child(idx).child('rebuyinCount').set(next);
    }

    function toggleOvercooked(idx) {
      const current = !currentUsers[idx].overcooked;
      adminRef.child(idx).child('overcooked').set(current);
    }

    function toggleNintendo(idx) {
      const current = !currentUsers[idx].nintendoLimit;
      adminRef.child(idx).child('nintendoLimit').set(current);
    }

    function resetAll() {
      if (confirm("모든 운영진 화면의 카운트와 체크 기록이 초기화됩니다. 계속하시겠습니까?")) {
        const updated = currentUsers.map(u => ({
          ...u,
          overcooked: false,
          nintendoLimit: false,
          rebuyinCount: 0
        }));
        adminRef.set(updated);
      }
    }

    // 6. 예약/대기열 관리 파트
    let currentQueueListener = null;

    function switchQueueGame(game) {
      currentQueueGame = game;
      document.querySelectorAll('.game-tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['holdem', 'blackjack', 'roulette'][idx] === game);
      });
      document.getElementById('queueGameTitle').textContent = queueGameTitles[game];
      
      updateUndoButtonState();
      listenQueue(game);
    }

    function listenQueue(game) {
      if (currentQueueListener) {
        currentQueueListener.off();
      }
      currentQueueListener = queueRootRef.child(game);
      currentQueueListener.on('value', (snapshot) => {
        currentQueueData = snapshot.val() || {};
        renderQueueList(currentQueueData);
      });
    }

    function addQueuePlayer() {
      const input = document.getElementById('queuePlayerInput');
      const name = input.value.trim();
      if (!name) return;

      const registeredNames = currentUsers
        .map(u => u.name ? u.name.trim() : '')
        .filter(n => n.length > 0);

      if (!registeredNames.includes(name)) {
        showWarnModal(name);
        return;
      }

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      queueRootRef.child(currentQueueGame).push({
        name: name,
        time: timeStr,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      });

      input.value = '';
      document.getElementById('autocompleteBox').style.display = 'none';
    }

    // 착석 완료 처리 (최대 3개 스택에 보관)
    function finishQueue(key) {
      if (!currentQueueData[key]) return;
      
      // 스택 맨 뒤에 추가
      undoStack.push({
        game: currentQueueGame,
        key: key,
        data: { ...currentQueueData[key] }
      });

      // 최대 3개 유지 (초과 시 가장 오래된 것 제거)
      if (undoStack.length > 3) {
        undoStack.shift();
      }

      queueRootRef.child(currentQueueGame).child(key).remove();
      updateUndoButtonState();
    }

    // 착석 취소(실행 취소): 스택 맨 뒤에서 꺼내어 원래 순번(createdAt) 그대로 복구
    function undoLastFinish() {
      // 현재 게임에 해당하는 가장 최근 백업 데이터 찾기
      const targetIndex = undoStack.map(item => item.game).lastIndexOf(currentQueueGame);
      if (targetIndex === -1) return;

      const [targetItem] = undoStack.splice(targetIndex, 1);
      const { key, data } = targetItem;

      queueRootRef.child(currentQueueGame).child(key).set(data);
      updateUndoButtonState();
    }

    // 현재 게임에 유효한 복구 데이터가 있는지 확인하고 버튼 갱신
    function updateUndoButtonState() {
      const undoBtn = document.getElementById('undoQueueBtn');
      const availableItems = undoStack.filter(item => item.game === currentQueueGame);

      if (availableItems.length > 0) {
        const lastItem = availableItems[availableItems.length - 1];
        undoBtn.style.display = 'inline-flex';
        undoBtn.innerHTML = `↩ <strong>${lastItem.data.name}</strong> 복구 (${availableItems.length})`;
      } else {
        undoBtn.style.display = 'none';
      }
    }

    // 해당 게임 대기열 전체 비우기
    function resetCurrentQueue() {
      if (confirm(`현재 [${queueGameTitles[currentQueueGame]}] 대기열을 모두 비우시겠습니까?`)) {
        queueRootRef.child(currentQueueGame).remove();
        // 현재 게임의 복구 스택 비우기
        undoStack = undoStack.filter(item => item.game !== currentQueueGame);
        updateUndoButtonState();
      }
    }

    function renderQueueList(data) {
      const container = document.getElementById('queueListContainer');
      const totalCount = document.getElementById('queueTotalCount');

      if (!data || Object.keys(data).length === 0) {
        totalCount.textContent = '0';
        container.innerHTML = '<div class="empty-state">현재 대기 중인 참가자가 없습니다.</div>';
        return;
      }

      const list = Object.keys(data).map(key => ({
        key: key,
        ...data[key]
      })).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

      totalCount.textContent = list.length;

      container.innerHTML = list.map((item, idx) => `
        <div class="queue-item">
          <div style="display: flex; align-items: center;">
            <span class="queue-num">#${idx + 1}</span>
            <div>
              <div class="queue-name">${item.name}</div>
              <div class="queue-time">접수 ${item.time || ''}</div>
            </div>
          </div>
          <div>
            <button class="q-btn-done" onclick="finishQueue('${item.key}')">착석</button>
          </div>
        </div>
      `).join('');
    }

    // 초기 실행
    listenQueue(currentQueueGame);
  </script>
</body>
</html>
