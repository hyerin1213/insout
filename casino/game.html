<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>게임 공식 룰북 - IN'S OUT CASINO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0d13;
      --card-bg: rgba(23, 27, 38, 0.95);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-primary: #f5c842;
      --neon-cyan: #00e5ff;
      --neon-green: #00ffaa;
      --accent-red: #ff5252;
      --text-main: #f0f2f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 0 14px calc(40px + env(safe-area-inset-bottom)) 14px;
      line-height: 1.5;
    }

    .top-nav {
      position: sticky;
      top: 0;
      background: rgba(11, 13, 19, 0.95);
      backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top)) 0 14px 0;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      margin-bottom: 16px;
      z-index: 10;
    }

    .back-btn {
      color: var(--gold-primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-title {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .page-sub {
      font-size: 12px;
      color: #9ba3b4;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card.highlight {
      border-color: rgba(245, 200, 66, 0.5);
      background: linear-gradient(180deg, rgba(35, 30, 18, 0.7) 0%, var(--card-bg) 100%);
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--gold-primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    ul.rule-list {
      list-style: none;
      font-size: 13px;
      color: #cfd4dc;
    }

    ul.rule-list li {
      position: relative;
      padding-left: 14px;
      margin-bottom: 8px;
    }

    ul.rule-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--gold-primary);
      font-size: 14px;
    }

    ul.rule-list li strong {
      color: #fff;
      font-weight: 800;
    }

    /* 배팅칩 화이트 볼드 강조 텍스트 */
    .chip-bold {
      color: #ffffff;
      font-weight: 800;
    }

    /* 보상 텍스트 */
    .reward-text {
      color: var(--neon-green);
      font-weight: 800;
    }

    /* ※ 별도 수수료 안내 문구 스타일 */
    .fee-notice {
      font-size: 12px;
      color: #ffd700;
      margin-top: 10px;
      padding-left: 2px;
      line-height: 1.4;
    }

    .fee-notice strong {
      color: #cfd4dc;
    }

    /* 도전 제한 경고 박스 */
    .warn-box {
      margin-top: 12px;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.35);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12px;
      color: #ff8a80;
      line-height: 1.45;
    }

    .warn-box strong {
      color: #ff5252;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      메인으로
    </a>
  </div>

  <div class="page-title">🎮 게임 설명서</div>
  <div class="page-sub">레이싱/닌텐도 게임</div>

  <!-- 1. 레이싱 기록 갱신 챌린지 -->
  <div class="card highlight">
    <div class="card-title">🏎️ 레이싱 기록 갱신 챌린지</div>
    <ul class="rule-list">
      <li><strong>도전 배팅:</strong> 1회 도전당 <span class="chip-bold">30칩</span></li>
      <li><strong>성공 보상:</strong> 최고 기록 달성 시 <span class="reward-text">100칩 지급</span></li>
    </ul>
    <!-- 도전 제한 경고 -->
    <div class="warn-box">
      ⚠️ <strong>도전 제한:</strong> <strong>직전 기록 보유자</strong>는 해당 게임 재도전 불가
    </div>
  </div>

  <!-- 2. 닌텐도 대전 모드 -->
  <div class="card">
    <div class="card-title">🎮 닌텐도 대전 모드 규정</div>
    <ul class="rule-list">
      <li><strong>진행 방식:</strong> 일반 대전(Versus) 모드로 2인이 3판 2선승제</li>
      <li><strong>참가 배팅:</strong> 1인당 <span class="chip-bold">60칩</span> 베팅</li>
      <li><strong>승리 보상:</strong> <span class="reward-text">110칩 지급</span></li>
    </ul>

    <!-- ※ 심판 수수료 별도 표시 -->
    <div class="fee-notice">
      ※ 배팅당 5칩은 심판(운영진) 수수료로 차감됩니다.
    </div>

    <!-- 도전 제한 경고 -->
    <div class="warn-box">
      ⚠️ <strong>도전 제한:</strong> <strong>5연승</strong> 달성 시 해당 게임 참가 불가
    </div>
  </div>

</body>
</html>
