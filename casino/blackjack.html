<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>블랙잭 룰 - IN'S OUT CASINO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0d13;
      --card-bg: rgba(23, 27, 38, 0.95);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-primary: #f5c842;
      --neon-cyan: #00e5ff;
      --neon-green: #00ffaa;
      --accent-red: #ff5252;
      --text-main: #f0f2f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 0 16px calc(40px + env(safe-area-inset-bottom)) 16px;
      line-height: 1.5;
    }

    .top-nav {
      position: sticky;
      top: 0;
      background: rgba(11, 13, 19, 0.95);
      backdrop-filter: blur(10px);
      padding: calc(14px + env(safe-area-inset-top)) 0 14px 0;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      margin-bottom: 18px;
      z-index: 10;
    }

    .back-btn {
      color: var(--gold-primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .page-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .page-sub {
      font-size: 12.5px;
      color: #9ba3b4;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .card.highlight {
      border-color: rgba(245, 200, 66, 0.45);
      background: linear-gradient(180deg, rgba(245, 200, 66, 0.08) 0%, var(--card-bg) 100%);
    }

    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--gold-primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bet-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .bet-item {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .bet-label {
      font-size: 11px;
      color: #9ba3b4;
      margin-bottom: 2px;
    }

    .bet-val {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold-primary);
    }

    ul.rule-list {
      list-style: none;
      font-size: 13px;
      color: #cfd4dc;
    }

    ul.rule-list li {
      position: relative;
      padding-left: 16px;
      margin-bottom: 8px;
    }

    ul.rule-list li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--gold-primary);
      font-size: 16px;
      line-height: 1;
    }

    ul.rule-list li strong {
      color: #fff;
      font-weight: 800;
    }

    .chip-bold {
      color: #ffffff;
      font-weight: 800;
    }

    .warn-box {
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 12.5px;
      color: #ffcdd2;
      line-height: 1.45;
    }

    .warn-box strong {
      color: #ff5252;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      메인으로
    </a>
  </div>

  <div class="page-title">🃏 블랙잭 공식 규정</div>
  <div class="page-sub">인스아웃 카지노 전용 블랙잭 베팅 및 운영 가이드</div>

  <!-- 베팅 한도 카드 -->
  <div class="card highlight">
    <div class="card-title">📌 베팅 규정 및 한도</div>
    <div class="bet-grid">
      <div class="bet-item">
        <div class="bet-label">최소 베팅</div>
        <div class="bet-val">40 칩</div>
      </div>
      <div class="bet-item">
        <div class="bet-label">최대 베팅</div>
        <div class="bet-val">80 칩</div>
      </div>
    </div>
    <ul class="rule-list">
      <li><strong>특수 베팅 예외:</strong> <strong>더블 다운</strong> 또는 <strong>스플릿</strong> 진행 시 최대 <span class="chip-bold">160칩</span>까지 확장 가능합니다.</li>
    </ul>
  </div>

  <!-- 게임 규칙 및 딜러 룰 -->
  <div class="card">
    <div class="card-title">⚡ 게임 진행 및 딜러 룰</div>
    <ul class="rule-list">
      <li><strong>딜러 룰 (H17):</strong> 딜러는 소프트 17(Soft 17)에서 히트(Hit)를 진행합니다.</li>
      <li><strong>판수 제한:</strong> 원활한 회전율을 위해 <strong>최대 10판</strong>까지 플레이 가능합니다.</li>
    </ul>

    <div class="warn-box">
      ⚠️ <strong>시스템 안내:</strong> 딜러 진행 및 기록 관리는 <strong>프로그램으로 자동 관리</strong>될 예정입니다.
    </div>
  </div>

</body>
</html>
